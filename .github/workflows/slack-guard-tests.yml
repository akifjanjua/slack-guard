name: Slack Guard Tests

on:
  push:
    branches: [master, "feature/**", "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt cryptography
      - name: Validate release
        run: python tools/validate_release.py
      - name: Run security tests
        run: python tools/security_test.py
      - name: Run command logic tests
        run: python tools/command_logic_test.py
      - name: Validate model-provider egress contract
        run: python tools/egress_contract_test.py
      - name: Verify committed module tree signature
        run: python tools/verify_module_tree.py .
      - name: Build clean release archive
        run: python tools/build_release.py
      - name: Verify release archive
        run: python tools/release_acceptance_test.py
